# =============================================================================
#  PROJECT IDENTITY
#  The only values that differ between the Keypop KMP API modules. Everything
#  below this section, and the whole of build.gradle.kts, is identical across
#  them: creating a module means filling in these five values and the
#  `rootProject.name` of settings.gradle.kts.
# =============================================================================

title = Keypop Reader Definitions KMP API
description = Kotlin Multiplatform API defining the RF technologies and card types shared by the Keypop reader APIs
version = 1.0.0-SNAPSHOT

# Specification this API transcribes. `spec.apiVersion` is the single source of truth for the
# version: the API and the specification are synchronized on MAJOR.MINOR only, each side advancing
# its own patch level. The `checkSpecConsistency` task enforces it against the `VERSION` of the
# `*ApiProperties` object, against every documentation link and against the version above.
spec.apiVersion = 1.0
spec.segment = reader-definitions

# =============================================================================
#  COMMON CONFIGURATION
#  Identical across the Keypop KMP API modules. The project, SCM and CI URLs are
#  absent on purpose: build.gradle.kts derives them from `rootProject.name`.
# =============================================================================

# Maven coordinates
group = org.eclipse.keypop

# Java Configuration
# Level of the emitted bytecode, kept at Java 8 so that the library can be integrated on legacy
# platforms. No toolchain is pinned: the compilation runs on the JDK that runs Gradle, which is 17
# or later by Gradle's own requirement, and the bytecode is held to Java 8 by the compiler options.
javaTargetLevel = 1.8

# UTF-8 for the special characters of the generated documentation, whatever the platform charset
org.gradle.jvmargs = "-Dfile.encoding=UTF-8"

# Specification Documentation
spec.docBaseUrl = https://docs.terminal-api.calypsonet.org

# Documentation Configuration
# Branding of the generated KDoc. Dokka takes a footer message and a homepage link; the logo
# image is a separate matter, Dokka replacing its own only from a local asset file.
docs.copyright = Copyright &copy; Calypso Networks Association. All Rights Reserved.
docs.homepageLink = https://keypop.org/

# Organization
organization.name = Eclipse Keypop
organization.url = https://keypop.org/
organization.repoBaseUrl = https://github.com/eclipse-keypop

# License
license.name = MIT license
license.url = https://opensource.org/license/mit/
license.distribution = repo

# Developers
developer.name = Keypop Contributors
developer.email = keypop-dev@eclipse.org

# Continuous Integration
ci.system = GitHub Actions
